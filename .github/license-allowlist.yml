# Exceptions for license-compliance.yml. One entry clears one High finding.
# Critical findings (denied licenses) cannot be cleared here.
#
# Entry schema (all keys except `license` and `expires` are required):
#   allow:
#     - package: "pkg:npm/some-lib"
#       license: "LGPL-3.0"           # optional: pin to one license
#       reason: "why this is acceptable"
#       approved-by: "@github-handle"
#       pr: "https://github.com/thisonedev/p2p-academy/pull/<n>"
#       expires: "2027-06-15"         # optional re-review date
allow:
  - package: "duck"
    reason: "npm metadata says only BSD; the LICENSE file in the package is the 2-clause BSD license (BSD-2-Clause, on the allow list). Pulled in by mammoth via lop."
    approved-by: "@thisonedev"
    pr: "https://github.com/thisonedev/p2p-academy/pull/55"
    expires: "2027-10-09"
  - package: "lru-cache"
    reason: "BlueOak-1.0.0 is a permissive, OSI-approved license that is not on the policy lists, so it reads as unknown."
    approved-by: "@thisonedev"
    pr: "https://github.com/thisonedev/p2p-academy/pull/55"
    expires: "2027-10-09"
  - package: "sax"
    reason: "BlueOak-1.0.0 is a permissive, OSI-approved license that is not on the policy lists, so it reads as unknown."
    approved-by: "@thisonedev"
    pr: "https://github.com/thisonedev/p2p-academy/pull/55"
    expires: "2027-10-09"
