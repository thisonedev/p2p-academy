name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: setup
        uses: ./.github/actions/setup

      # This job runs on fork PRs, so the lockfile it installs from is the PR's.
      # A dependency postinstall would execute on the runner before anyone has
      # read the diff. The build does not need one: esbuild resolves its binary
      # from the platform package through its JS API, and sharp goes unused
      # because next.config.mjs sets images.unoptimized.
      - name: install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: lint
        run: pnpm --filter @p2p-academy/web lint

      - name: build
        env:
          NODE_ENV: production
        run: pnpm build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./apps/web/out

  deploy:
    needs: verify
    if: github.event_name != 'pull_request' && github.repository == 'thisonedev/p2p-academy'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
