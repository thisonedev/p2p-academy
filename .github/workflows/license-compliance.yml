name: License compliance

# Docs: tetherto/qvac-actions docs/license-compliance-ci.md
# Checks only the dependencies a PR changes. qvac runs it warn-only; here it blocks.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  license:
    uses: tetherto/qvac-actions/.github/workflows/public-reusable-license.yml@be92c8789aa507dd3d94c8c3cd9cede99ca3b069 # 0.5.0
    permissions:
      contents: read
      pull-requests: write
    with:
      allowlist-path: .github/license-allowlist.yml
