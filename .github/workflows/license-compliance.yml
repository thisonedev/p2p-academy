name: License compliance

# Calls Tether's license gate the way tetherto/qvac does, but blocking, not warn-only.
# It checks the licenses of dependencies a PR adds or changes, plus an advisory NOTICE check.
# The reusable workflow fails on purpose under pull_request_target.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  license:
    uses: tetherto/qvac-actions/.github/workflows/public-reusable-license.yml@096b1cfbd1d95399ae64d37f55cc16fd7a43314e # 0.4.0
    permissions:
      contents: read
      pull-requests: write
    with:
      allowlist-path: .github/license-allowlist.yml
