name: Workflow security

# Runs zizmor on .github/ like tetherto/qvac's workflow-security gate, but any finding fails the job.
# Offline and secret-free, so fork PRs run it too.

on:
  push:
    branches: [master]
    paths:
      - '.github/**'
  pull_request:
    paths:
      - '.github/**'
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # qvac pins 1.27.0, which PyPI yanked (GHSA-f42p-wjw5-97qh).
      ZIZMOR_VERSION: '1.30.1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.x'

      - name: install zizmor
        run: pip install "zizmor==${ZIZMOR_VERSION}"

      # --format=github shows findings as annotations on the PR diff.
      - name: audit
        run: zizmor --persona=regular --offline --no-progress --format=github .github/
