name: Workflow security

# Same zizmor audit as tetherto/qvac's workflow-security.yml, but any finding fails the job.

on:
  push:
    branches: [master]
    paths:
      - '.github/**'
  pull_request:
    paths:
      - '.github/**'
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # qvac pins 1.27.0, which PyPI yanked (GHSA-f42p-wjw5-97qh).
      ZIZMOR_VERSION: '1.30.1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: install zizmor
        run: pip install "zizmor==${ZIZMOR_VERSION}"

      - name: audit
        run: zizmor --persona=regular --offline --no-progress --format=github .github/
