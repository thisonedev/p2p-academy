name: Release tag

# The maintainer pushes a signed vX.Y.Z tag on the merged release commit. This
# checks it with the CLI's own tag check, then publishes a GitHub Release with
# its CHANGELOG section. The CLI checks the tag again on every user's machine.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-tag
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'thisonedev/p2p-academy'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: check the signed tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Fetched again so the local tag is the annotated tag object itself.
          git fetch --force --no-tags origin "refs/tags/${TAG}:refs/tags/${TAG}"
          VERSION=$(node -p 'require("./package.json").version')
          if [ "$TAG" != "v${VERSION}" ]; then
            echo "::error::${TAG} does not match package.json version ${VERSION}"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$TAG" origin/master; then
            echo "::error::${TAG} is not on master"
            exit 1
          fi
          node -e 'require("./apps/cli/src/release-verify").verifyReleaseTag(".", process.env.TAG)'

      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          node scripts/changelog-notes.mjs "${TAG#v}" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
