name: Security baseline

# Calls Tether's security baseline (TruffleHog secrets, CodeQL) the way tetherto/qvac does.
# Pinned to the commit of a qvac-actions release tag, never a branch.
# Runs on pull_request, not pull_request_target, so fork PRs get no secrets.

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    uses: tetherto/qvac-actions/.github/workflows/public-reusable-security.yml@096b1cfbd1d95399ae64d37f55cc16fd7a43314e # 0.4.0
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      actions: read
    with:
      languages: javascript-typescript
      severity-threshold: high
