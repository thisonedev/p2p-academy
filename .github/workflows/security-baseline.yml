name: Security baseline

# Docs: tetherto/qvac-actions docs/security-baseline.md

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    uses: tetherto/qvac-actions/.github/workflows/public-reusable-security.yml@096b1cfbd1d95399ae64d37f55cc16fd7a43314e # 0.4.0
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      actions: read
    with:
      languages: javascript-typescript
      severity-threshold: high
      # Lesson starter files import what the reader's TODOs go on to use, so CodeQL
      # reports each import as unused. TruffleHog reads the same line as a regex,
      # where it matches no file, so the secret scan still covers the starters.
      paths-exclude: |
        packages/courses/examples/qvac/*/*.starting.ts
