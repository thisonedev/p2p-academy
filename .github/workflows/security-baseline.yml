name: Security baseline

# Docs: tetherto/qvac-actions docs/security-baseline.md

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    uses: tetherto/qvac-actions/.github/workflows/public-reusable-security.yml@be92c8789aa507dd3d94c8c3cd9cede99ca3b069 # 0.5.0
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      actions: read
    with:
      languages: javascript-typescript
      severity-threshold: high
